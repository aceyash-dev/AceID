<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f5f2"
  >

  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">

  <title>Set a new password — Ace ID</title>

  <style>
    @font-face {
      font-family: "Satoshi";
      src: url("/fonts/Satoshi-Variable.woff2")
        format("woff2");
      font-style: normal;
      font-weight: 300 900;
      font-display: swap;
    }

    @font-face {
      font-family: "Instrument Serif";
      src: url("/fonts/InstrumentSerif-Regular.woff2")
        format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --background: #f5f5f2;
      --foreground: #111;
      --muted: #70706b;
      --line: #d1d1cc;
      --surface: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--background);
      color: var(--foreground);

      font-family: "Satoshi", sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a,
    button,
    .brand,
    .eyebrow,
    .back {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
    }

    .page {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;
    }

    .auth {
      width: min(430px, 100%);
    }

    .brand {
      display: inline-flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 42px;

      color: var(--foreground);

      font-size: 15px;
      font-weight: 700;

      letter-spacing: -.035em;

      text-decoration: none;
    }

    .brand img {
      width: 30px;
      height: 30px;

      object-fit: contain;

      border: 0;
    }

    .card {
      padding: 36px;

      background: var(--surface);

      border: 1px solid #111;
    }

    .eyebrow {
      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: .12em;

      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;

      font-family: "Instrument Serif", serif;

      font-size: 52px;
      font-weight: 400;

      line-height: .9;

      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 0 0 30px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 50px;

      padding: 0 14px;

      border: 1px solid var(--line);
      border-radius: 0;

      outline: none;

      background: #fff;
      color: #111;

      font: inherit;
      font-size: 15px;

      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    input:hover {
      border-color: #999;
    }

    input:focus {
      border-color: #111;

      box-shadow:
        0 0 0 1px #111;
    }

    button {
      width: 100%;
      height: 50px;

      border: 1px solid #111;
      border-radius: 0;

      background: #111;
      color: #fff;

      font-family: "Satoshi", sans-serif;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease;
    }

    button:hover {
      background: #303030;
    }

    button:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    .back {
      margin-top: 24px;

      color: var(--muted);

      font-size: 13px;

      text-align: center;
    }

    .back a {
      color: #111;

      font-weight: 600;

      text-underline-offset: 3px;
    }

    .hint {
      margin-top: 8px;

      color: var(--muted);

      font-size: 12px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 16px;
      }

      .auth {
        width: 100%;
      }

      .brand {
        margin-bottom: 30px;
      }

      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 46px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input,
      button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="auth">

      <a
        class="brand"
        href="/"
        aria-label="Ace ID home"
      >
        <img
          src="/icon.png"
          alt=""
          width="30"
          height="30"
        >

        <span>Ace ID</span>
      </a>

      <div class="card">

        <div class="eyebrow">
          The Ace Base
        </div>

        <h1>
          New password
        </h1>

        <p class="subtitle">
          Choose a new password for your Ace ID.
        </p>

        <form
          method="post"
          action="/reset-password"
        >

          <input
            type="hidden"
            name="token"
            value="{{TOKEN}}"
          >

          <div class="field">

            <label for="password">
              New password
            </label>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="30"
              required
              autofocus
            >

            <div class="hint">
              8–30 characters.
            </div>

          </div>

          <div class="field">

            <label for="password-confirm">
              Confirm password
            </label>

            <input
              id="password-confirm"
              name="password_confirm"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="30"
              required
            >

          </div>

          <button type="submit">
            Set new password
          </button>

        </form>

        <div class="back">
          <a href="/login">
            Back to sign in
          </a>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
