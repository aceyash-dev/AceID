<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f2">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
<title>Verify sign in · Ace ID</title>
<style>
.challenge-status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:11px 12px;border:1px solid #d1d1cc;background:#f8f8f5;color:#666;font-size:11px;line-height:1.4}
.challenge-status strong{color:#111;font-variant-numeric:tabular-nums;font-size:12px}
.challenge-status.expired{border-color:#111;background:#f3f3ef;color:#111}
button:disabled{opacity:.55;cursor:wait}
@font-face{font-family:Satoshi;src:url("/fonts/Satoshi-Variable.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Instrument Serif";src:url("/fonts/InstrumentSerif-Regular.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f5f2;color:#111;font-family:Satoshi,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(460px,100%);border:1px solid #111;background:#fff;padding:clamp(24px,6vw,32px)}
.brand{font-weight:800;font-size:18px;margin-bottom:42px}
h1{margin:0 0 14px;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(40px,10vw,50px);font-weight:400;line-height:.95;letter-spacing:-.035em}
p{color:#666;line-height:1.55}
.error{min-height:20px;color:#b42318;font-size:13px;margin-top:12px;line-height:1.45}
.restart{display:inline-flex;align-items:center;justify-content:center;min-height:42px;margin-top:8px;padding:0 14px;border:1px solid #111;color:#111;background:#fff;font-size:13px;font-weight:700;text-decoration:none}

label{display:block;font-size:13px;font-weight:700;margin:24px 0 8px}
input{width:100%;height:52px;border:1px solid #aaa;background:#fff;padding:0 14px;font:inherit;letter-spacing:.14em}
button{width:100%;height:50px;margin-top:14px;border:1px solid #111;background:#111;color:#fff;font:inherit;font-weight:750;cursor:pointer}
.secondary{background:#fff;color:#111}
.note{font-size:12px;margin-top:22px}
</style>
</head>
<body>
<main>
<div class="brand">Ace ID</div>
<h1>Verify your sign in</h1>
<p id="instruction">Open your authenticator app and enter the 6-digit code.</p>
<div class="challenge-status" id="challengeStatus" role="status" aria-live="polite">
  <span>Verification expires in</span>
  <strong id="countdown">3:30</strong>
</div>
<form method="post" action="/login/mfa">
<input type="hidden" name="challenge" value="{{CHALLENGE}}">
<input type="hidden" name="method" id="method" value="totp">
<label for="code">Authenticator code</label>
<input id="code" name="code" inputmode="numeric" aria-describedby="instruction challengeStatus error" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" maxlength="8" required autofocus>
<div class="error ace-status error" id="error" role="alert">{{ERROR_MESSAGE}}</div>
<a class="restart" id="restart" href="/login?return=%2Faccount">Start a new sign-in</a>
<button type="submit" id="verifyButton">Verify</button>
<button type="button" class="secondary" id="recoveryButton">Use a recovery code</button>
</form>
<p class="note" id="note">Your verification request expires after 210 seconds. Recovery codes are single-use.</p>
<script>
const method=document.getElementById("method");
const input=document.getElementById("code");
const recovery=document.getElementById("recoveryButton");
const note=document.getElementById("note");
const verifyButton=document.getElementById("verifyButton");
const instruction=document.getElementById("instruction");
const challengeStatus=document.getElementById("challengeStatus");
const countdown=document.getElementById("countdown");
const form=document.querySelector("form");
const error=document.getElementById("error");
const restart=document.getElementById("restart");
const errorMessage=error.textContent.trim();
if(!errorMessage||errorMessage.includes("{{ERROR_MESSAGE}}")){
  error.textContent="";
  error.style.display="none";
  restart.style.display="none";
}
let remaining=210;
const timer=setInterval(()=>{
  remaining=Math.max(0,remaining-1);
  const minutes=Math.floor(remaining/60);
  const seconds=String(remaining%60).padStart(2,"0");
  countdown.textContent=`${minutes}:${seconds}`;
  if(remaining===0){
    clearInterval(timer);
    challengeStatus.classList.add("expired");
    challengeStatus.innerHTML="<strong>Verification expired</strong>";
    verifyButton.disabled=true;
    input.disabled=true;
    recovery.disabled=true;
    restart.style.display="inline-block";
    input.focus({preventScroll:true});
  }
},1000);

input.addEventListener("input",()=>{
  if(method.value==="totp") input.value=input.value.replace(/[^0-9]/g,"").slice(0,8);
});

form.addEventListener("submit",()=>{
  if(remaining<=0)return;
  verifyButton.disabled=true;
  verifyButton.setAttribute("aria-busy","true");
  verifyButton.textContent="Verifying…";
  recovery.disabled=true;
});

recovery.addEventListener("click",()=>{
  const isRecovery=method.value==="recovery";
  method.value=isRecovery?"totp":"recovery";
  input.value="";
  input.maxLength=isRecovery?39:8;
  input.pattern=isRecovery?"[A-Za-z0-9-]{32,39}":"[0-9 ]{6,8}";
  input.inputMode=isRecovery?"text":"numeric";
  input.autocomplete=isRecovery?"off":"one-time-code";
  document.querySelector("label").textContent=isRecovery?"Recovery code":"Authenticator code";
  instruction.textContent=isRecovery?"Enter one of your unused recovery codes.":"Open your authenticator app and enter the 6-digit code.";
  recovery.textContent=isRecovery?"Use authenticator app":"Use a recovery code";
  note.textContent=isRecovery?"This recovery code will be consumed after successful verification.":"Your verification request expires after 210 seconds. Recovery codes are single-use.";
});
</script>
</main>
</body>
</html>
