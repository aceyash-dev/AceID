<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f5f2"
  >

  <meta
    name="description"
    content="Create an Ace ID."
  >

  <link rel="icon" type="image/png" sizes="192x192" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">

  <title>Create Ace ID — Ace ID</title>

  <style>
    @font-face {
      font-family: "Satoshi";

      src:
        url("/fonts/Satoshi-Variable.woff2")
        format("woff2");

      font-style: normal;
      font-weight: 300 900;
      font-display: swap;
    }

    @font-face {
      font-family: "Instrument Serif";

      src:
        url("/fonts/InstrumentSerif-Regular.woff2")
        format("woff2");

      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --bg: #f5f5f2;
      --fg: #111;
      --muted: #70706b;
      --line: #d1d1cc;
      --surface: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--bg);
      color: var(--fg);

      font-family: "Satoshi", sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a,
    button,
    .brand,
    .eyebrow,
    .signin {
      -webkit-tap-highlight-color: transparent;

      user-select: none;
      -webkit-user-select: none;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
    }

    .page {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;
    }

    .auth {
      width: min(620px, 100%);
    }

    .brand {
      display: inline-flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 42px;

      color: var(--fg);

      font-size: 15px;
      font-weight: 700;

      letter-spacing: -.035em;

      text-decoration: none;
    }

    .brand img {
      width: 30px;
      height: 30px;

      object-fit: contain;

      border: 0;
    }

    .card {
      padding: 36px;

      background: var(--surface);

      border: 1px solid #111;
    }

    .eyebrow {
      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: .12em;

      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;

      font-family: "Instrument Serif", serif;

      font-size: 54px;
      font-weight: 400;

      line-height: .9;

      letter-spacing: -.045em;
    }

    .subtitle {
      max-width: 470px;

      margin: 0 0 30px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.5;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 10px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      top: 1px;
      right: 1px;
      width: 50px;
      height: 50px;
      margin: 0;
      padding: 0;
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      color: #70706b;
      display: grid;
      place-items: center;
    }

    .password-toggle:hover {
      background: #f5f5f2;
      color: #111;
    }

    .password-toggle:focus-visible {
      outline: 2px solid #111;
      outline-offset: -2px;
    }

    .username-status {
      min-height: 18px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .username-status.available {
      color: #146c2e;
    }

    .username-status.taken {
      color: #9a1c1c;
    }

    .username-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .username-suggestion {
      width: auto;
      height: 30px;
      margin: 0;
      padding: 0 9px;
      border: 1px solid var(--line);
      background: #fff;
      color: #111;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }

    .username-suggestion:hover {
      border-color: #111;
      background: #f5f5f2;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 12px;
      font-weight: 650;

      letter-spacing: -.01em;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 14px;

      border: 1px solid var(--line);
      border-radius: 0;

      outline: none;

      background: #fff;
      color: #111;

      font-family: "Satoshi", sans-serif;

      font-size: 15px;
      font-weight: 500;

      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    input:hover {
      border-color: #999;
    }

    input:focus {
      border-color: #111;

      box-shadow:
        0 0 0 1px #111;
    }

    input::placeholder {
      color: #aaa;
      opacity: 1;
    }

    button {
      grid-column: 1 / -1;

      width: 100%;
      height: 52px;

      margin-top: 2px;

      border: 1px solid #111;
      border-radius: 0;

      background: #111;
      color: #fff;

      font-family: "Satoshi", sans-serif;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s ease;
    }

    button:hover {
      background: #303030;
    }

    button:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .terms {
      margin: 18px 0 0;

      color: var(--muted);

      font-size: 11px;

      line-height: 1.55;
    }

    .terms a {
      color: #111;

      text-underline-offset: 3px;
    }

    .signin {
      margin-top: 24px;

      color: var(--muted);

      font-size: 13px;

      text-align: center;
    }

    .signin a {
      color: #111;

      font-weight: 600;

      text-underline-offset: 3px;
    }

    /*
     * Snackbar
     */

    .snackbar {
      position: fixed;

      left: 50%;
      bottom: 24px;

      z-index: 1000;

      width: max-content;
      max-width: calc(100vw - 32px);

      padding: 12px 16px;

      background: #111;
      color: #fff;

      border: 1px solid #111;

      font-family: "Satoshi", sans-serif;

      font-size: 13px;
      font-weight: 550;

      line-height: 1.4;

      opacity: 0;
      visibility: hidden;

      transform:
        translate(-50%, 18px);

      pointer-events: none;

      transition:
        opacity .18s ease,
        transform .18s ease,
        visibility .18s ease;
    }

    .snackbar.show {
      opacity: 1;
      visibility: visible;

      transform:
        translate(-50%, 0);
    }

    @media (max-width: 600px) {
      .page {
        padding: 16px;
      }

      .auth {
        width: 100%;
      }

      .brand {
        margin-bottom: 30px;
      }

      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 46px;
      }

      .form-grid {
        grid-template-columns: 1fr;

        gap: 14px;
      }

      .field.full {
        grid-column: auto;
      }

      button {
        grid-column: auto;

        margin-top: 0;
      }
    }

    @media (max-width: 480px) {
      .snackbar {
        bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input,
      button,
      .snackbar {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="auth">

      <a
        class="brand"
        href="/"
        aria-label="Ace ID home"
      >
        <img
          src="/icon.png"
          alt=""
          width="30"
          height="30"
        >

        <span>Ace ID</span>
      </a>

      <div class="card">

        <div class="eyebrow">
          The Ace Base
        </div>

        <h1>
          Create Ace ID
        </h1>

        <p class="subtitle">
          Create your Ace ID and use it across
          supported Ace Base applications.
        </p>

        <form
          method="post"
          action="/register"
          novalidate
        >

          <div class="form-grid">

            <div class="field">

              <label for="display-name">
                Name
              </label>

              <input
                id="display-name"
                name="displayName"
                type="text"
                autocomplete="name"
                required
              >

            </div>

            <div class="field">

              <label for="username">
                Username
              </label>

              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                pattern="[A-Za-z0-9-]{3,20}"
                minlength="3"
                maxlength="20"
                required
                aria-describedby="username-status"
              >

              <div
                id="username-status"
                class="username-status"
                role="status"
                aria-live="polite"
              ></div>

              <div
                id="username-suggestions"
                class="username-suggestions"
                aria-label="Available username suggestions"
              ></div>

            </div>

            <div class="field full">

              <label for="email">
                Email
              </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                required
              >

            </div>

            <div class="field">

              <label for="password">
                Password
              </label>

              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  maxlength="30"
                  required
                >

                <button
                  class="password-toggle"
                  id="passwordToggle"
                  type="button"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <iconify-icon
                    icon="hugeicons:view"
                    width="20"
                    height="20"
                    aria-hidden="true"
                  ></iconify-icon>
                </button>
              </div>

            </div>

            <div class="field">

              <label for="confirm-password">
                Confirm password
              </label>

              <div class="password-field">
                <input
                  id="confirm-password"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  maxlength="30"
                  required
                >

                <button
                  class="password-toggle"
                  id="confirmPasswordToggle"
                  type="button"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <iconify-icon
                    icon="hugeicons:view"
                    width="20"
                    height="20"
                    aria-hidden="true"
                  ></iconify-icon>
                </button>
              </div>

            </div>

            <button type="submit">
              Create Ace ID
            </button>

          </div>

        </form>

        <p class="terms">
          By creating an Ace ID, you agree to the
          <a href="/terms">Ace ID Terms of Service</a>
          and <a href="/privacy">Privacy Policy</a>.
        </p>

        <div class="signin">
          Already have an Ace ID?
          <a href="/login">
            Sign in
          </a>
        </div>

      </div>

    </section>

  </main>

  <div
    id="snackbar"
    class="snackbar"
    role="status"
    aria-live="polite"
  ></div>

  <script
    src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
  ></script>

  <script>
    const form =
      document.querySelector("form");

    const snackbar =
      document.getElementById("snackbar");

    const username =
      document.getElementById("username");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById(
        "confirm-password"
      );

    let snackbarTimer;
    let usernameCheckTimer;
    let usernameCheckController;
    let usernameCheckRequest = 0;
    let usernameAvailable = false;
    let usernameCheckComplete = false;

    const usernameStatus =
      document.getElementById("username-status");

    const usernameSuggestions =
      document.getElementById("username-suggestions");

    function showSnackbar(message) {
      clearTimeout(snackbarTimer);

      snackbar.textContent = message;
      snackbar.classList.add("show");

      snackbarTimer = setTimeout(() => {
        snackbar.classList.remove("show");
      }, 3200);
    }

    function setUsernameStatus(message, state = "") {
      usernameStatus.textContent = message;
      usernameStatus.className =
        "username-status" +
        (state ? " " + state : "");
    }

    function renderSuggestions(suggestions) {
      usernameSuggestions.replaceChildren();

      for (const suggestion of suggestions) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "username-suggestion";
        button.textContent = suggestion;

        button.addEventListener("click", () => {
          username.value = suggestion;
          username.dispatchEvent(new Event("input", { bubbles: true }));
          username.focus();
        });

        usernameSuggestions.appendChild(button);
      }
    }

    async function checkUsernameAvailability() {
      const value = username.value.trim().toLowerCase();

      usernameAvailable = false;
      usernameCheckComplete = false;
      renderSuggestions([]);

      if (!/^[a-z0-9-]{3,20}$/.test(value)) {
        if (value) {
          setUsernameStatus(
            "Use 3–20 characters: A–Z, 0–9, or hyphens."
          );
        } else {
          setUsernameStatus("");
        }
        return;
      }

      const requestId = ++usernameCheckRequest;

      if (usernameCheckController) {
        usernameCheckController.abort();
      }

      usernameCheckController = new AbortController();

      setUsernameStatus("Checking username…");

      try {
        const response = await fetch(
          "/api/username-availability?username=" +
            encodeURIComponent(value),
          {
            method: "GET",
            cache: "no-store",
            signal: usernameCheckController.signal,
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error("availability_check_failed");
        }

        const result = await response.json();

        if (
          requestId !== usernameCheckRequest ||
          username.value.trim().toLowerCase() !== value
        ) {
          return;
        }

        usernameCheckComplete = true;
        usernameAvailable = Boolean(result.available);

        if (result.available) {
          setUsernameStatus("Username is available.", "available");
          return;
        }

        setUsernameStatus("Username is already taken.", "taken");
        renderSuggestions(
          Array.isArray(result.suggestions)
            ? result.suggestions
            : []
        );
      } catch (error) {
        if (error.name === "AbortError") return;

        if (requestId !== usernameCheckRequest) return;

        usernameCheckComplete = false;
        usernameAvailable = false;
        setUsernameStatus(
          "Unable to check username. Try again before continuing."
        );
      }
    }

    username.addEventListener("input", () => {
      clearTimeout(usernameCheckTimer);
      usernameAvailable = false;
      usernameCheckComplete = false;

      const value = username.value.trim();

      if (!value) {
        setUsernameStatus("");
        renderSuggestions([]);
        return;
      }

      setUsernameStatus("Checking username…");

      usernameCheckTimer = setTimeout(
        checkUsernameAvailability,
        300
      );
    });

    function setupPasswordToggle(input, button) {
      const icon = button.querySelector("iconify-icon");

      button.addEventListener("click", () => {
        const showing = input.type === "text";

        input.type = showing ? "password" : "text";
        button.setAttribute(
          "aria-pressed",
          String(!showing)
        );
        button.setAttribute(
          "aria-label",
          showing ? "Show password" : "Hide password"
        );

        icon.setAttribute(
          "icon",
          showing
            ? "hugeicons:view"
            : "hugeicons:view-off"
        );

        input.focus({ preventScroll: true });
      });
    }

    setupPasswordToggle(
      password,
      document.getElementById("passwordToggle")
    );

    setupPasswordToggle(
      confirmPassword,
      document.getElementById("confirmPasswordToggle")
    );

    form.addEventListener(
      "submit",
      async (event) => {
        const name =
          document.getElementById("display-name");

        const email =
          document.getElementById("email");

        if (!name.value.trim()) {
          event.preventDefault();
          showSnackbar("Enter your name.");
          name.focus();
          return;
        }

        if (!/^[A-Za-z0-9-]{3,20}$/.test(username.value)) {
          event.preventDefault();
          showSnackbar(
            "Username must be 3–20 characters and use only A–Z, 0–9, or hyphens."
          );
          username.focus();
          return;
        }

        if (!usernameCheckComplete) {
          event.preventDefault();
          showSnackbar("Check username availability first.");
          await checkUsernameAvailability();
          username.focus();
          return;
        }

        if (!usernameAvailable) {
          event.preventDefault();
          showSnackbar("Choose an available username.");
          username.focus();
          return;
        }

        if (!email.validity.valid) {
          event.preventDefault();
          showSnackbar("Enter a valid email address.");
          email.focus();
          return;
        }

        if (
          password.value.length < 8 ||
          password.value.length > 30
        ) {
          event.preventDefault();
          showSnackbar("Password must be 8–30 characters.");
          password.focus();
          return;
        }

        if (
          confirmPassword.value.length < 8 ||
          confirmPassword.value.length > 30
        ) {
          event.preventDefault();
          showSnackbar(
            "Confirmation password must be 8–30 characters."
          );
          confirmPassword.focus();
          return;
        }

        if (password.value !== confirmPassword.value) {
          event.preventDefault();
          showSnackbar("Passwords don't match.");
          confirmPassword.focus();
          return;
        }
      }
    );
  </script>

  <script src="/js/cookie-banner.js" defer></script>
</body>
</html>
