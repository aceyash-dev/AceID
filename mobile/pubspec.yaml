name: ace_id_mobile
description: Native Ace ID account app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.29.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_appauth: ^8.0.3
  flutter_secure_storage: ^9.2.4
  hugeicons: ^1.2.0
  http: ^1.3.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../public/icon.png
  min_sdk_android: 26
