org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Runtime configuration is supplied at build time, never committed:
#   ACEID_ISSUER            e.g. https://identity.ace-base.cc
#   ACEID_API_BASE_URL      optional; defaults to ACEID_ISSUER
#   ACEID_MOBILE_CLIENT_ID  the registered PUBLIC OIDC client ID
#   ACEID_MOBILE_REDIRECT_URI  defaults to app.tab.aid:/oauth2redirect
#
# Provide them as -P Gradle properties, environment variables, or local
# entries below in an untracked file. Never put a client secret here.
aceidIssuer=https://identity.ace-base.cc
aceidMobileRedirectUri=app.tab.aid:/oauth2redirect
