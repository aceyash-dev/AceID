name: Ace ID Android build

on:
  push:
    branches: ["main"]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    branches: ["main"]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate public OIDC client configuration
        env:
          ACEID_MOBILE_CLIENT_ID: ${{ vars.ACEID_MOBILE_CLIENT_ID }}
          ACEID_MOBILE_REDIRECT_URI: ${{ vars.ACEID_MOBILE_REDIRECT_URI }}
        shell: bash
        run: |
          if [[ -z "${ACEID_MOBILE_CLIENT_ID//[[:space:]]/}" ]]; then
            echo "::error title=Missing mobile OIDC client::Set ACEID_MOBILE_CLIENT_ID to the registered public OIDC client ID. Do not configure a client secret in the app."
            exit 1
          fi
          if [[ "${ACEID_MOBILE_REDIRECT_URI:-app.tab.aid:/oauth2redirect}" != "app.tab.aid:/oauth2redirect" ]]; then
            echo "::error title=Invalid mobile redirect URI::Set ACEID_MOBILE_REDIRECT_URI to app.tab.aid:/oauth2redirect."
            exit 1
          fi

      - name: Assert the client is native Kotlin
        shell: bash
        run: |
          if find mobile \( -name '*.dart' -o -name 'pubspec.yaml' -o -name '*.gradle' \) -print | grep -q .; then
            echo "::error title=Flutter sources present::The Android client must not contain Dart sources, a pubspec, or Flutter Groovy build files."
            exit 1
          fi
          if grep -rqi "flutter" mobile/app mobile/settings.gradle.kts mobile/build.gradle.kts mobile/gradle; then
            echo "::error title=Flutter dependency present::Remove any remaining Flutter reference from the Android client."
            exit 1
          fi

      - name: Unit tests
        working-directory: mobile
        env:
          ACEID_ISSUER: ${{ vars.ACEID_ISSUER || 'https://identity.ace-base.cc' }}
          ACEID_MOBILE_CLIENT_ID: ${{ vars.ACEID_MOBILE_CLIENT_ID }}
          ACEID_MOBILE_REDIRECT_URI: ${{ vars.ACEID_MOBILE_REDIRECT_URI }}
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: mobile
        env:
          ACEID_ISSUER: ${{ vars.ACEID_ISSUER || 'https://identity.ace-base.cc' }}
          ACEID_MOBILE_CLIENT_ID: ${{ vars.ACEID_MOBILE_CLIENT_ID }}
          ACEID_MOBILE_REDIRECT_URI: ${{ vars.ACEID_MOBILE_REDIRECT_URI }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ace-id-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
